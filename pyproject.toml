[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemml"
version = "1.1.0"
description = "A desktop GUI for chemical data analysis and machine learning."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Justin K. Kirkland" }]
keywords = ["chemistry", "machine-learning", "rdkit", "cheminformatics", "gui"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
	"Operating System :: OS Independent",
	"Intended Audience :: Science/Research",
	"Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
	"PyQt5>=5.15",
	"pandas>=2.0",
	"numpy>=1.24",
	"scikit-learn>=1.3",
	"scipy>=1.10",
	"matplotlib>=3.7",
	"seaborn>=0.13",
	"rdkit>=2023.3",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0",
	"pytest-qt>=4.4",
	"pytest-cov>=6.0",
	"ruff>=0.5",
	"mypy>=1.8",
]
build = ["pyinstaller>=6.0"]

[project.scripts]
chemml = "main:main"

[project.urls]
Homepage = "https://github.com/JustinKKirkland/ChemML"
Repository = "https://github.com/JustinKKirkland/ChemML"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["chemml*"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:joblib.*"]
